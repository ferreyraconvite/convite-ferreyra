<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 Anos do Ferreyra 🎉</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;
font-family:Arial,sans-serif;color:#fff;background:#090909;overflow:hidden}
body:before{content:"";position:fixed;inset:-50%;background:
radial-gradient(circle at 20% 20%,#ff2d75 0 2px,transparent 3px),
radial-gradient(circle at 70% 30%,#ffd43b 0 2px,transparent 3px),
radial-gradient(circle at 40% 80%,#00e5ff 0 2px,transparent 3px);
background-size:90px 90px,120px 120px,150px 150px;animation:move 8s linear infinite;opacity:.55}
@keyframes move{to{transform:translate(80px,60px)}}
.card{position:relative;width:min(440px,100%);padding:35px 24px 28px;text-align:center;border-radius:30px;
background:linear-gradient(145deg,#181818,#050505);border:2px solid #ffd43b;
box-shadow:0 0 20px #ff2d75,0 0 50px #7c2cff;overflow:hidden}
.confetti{font-size:30px;letter-spacing:8px;animation:bounce 1.5s infinite}
@keyframes bounce{50%{transform:translateY(-8px) rotate(2deg)}}
.kicker{margin-top:10px;color:#ffd43b;font-weight:800;letter-spacing:4px;font-size:13px}
h1{margin:10px 0 0;font-size:72px;line-height:.9;color:#fff;text-shadow:0 0 10px #ff2d75,0 0 25px #7c2cff}
h2{margin:12px 0 24px;font-size:28px;color:#ffd43b}
.party{font-size:17px;line-height:1.8;background:#ffffff0d;border-radius:20px;padding:18px 10px;border:1px solid #ffffff20}
.party strong{color:#fff}
.msg{margin:20px 0 10px;font-size:18px;font-weight:bold}
.btn{display:block;margin:16px auto 0;width:fit-content;padding:14px 22px;border-radius:999px;
background:#25D366;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 0 18px #25D366}
.small{margin-top:18px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="card">
  <div class="confetti">🎉 ✨ 🥳</div>
  <div class="kicker">VEM COMEMORAR!</div>
  <h1>18</h1>
  <h2>ANOS DO FERREYRA</h2>
  <div class="party">
    🗓️ <strong>31 de outubro a 1º de novembro</strong><br>
    ⏰ <strong>19:00</strong><br>
    📍 <strong>Chácara do Ipês</strong>
  </div>
  <div class="msg">🔥 Uma noite para ficar na memória! 🔥</div>
  <div>Você está convidado para essa festa inesquecível! 🎶🕺</div>
  <a class="btn" href="https://wa.me/5567999197712">📲 MAIS INFORMAÇÕES</a>
  <div class="small">Esperamos você! 💥</div>
</div>
</body>
</html>
